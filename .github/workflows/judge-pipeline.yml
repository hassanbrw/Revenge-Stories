name: Judge Pipeline

on:
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "scripts_rerender.py"
      - "requirements.txt"
      - ".github/workflows/judge-pipeline.yml"
  pull_request:
    paths:
      - "pipeline/**"
      - "scripts_rerender.py"
      - "requirements.txt"
      - ".github/workflows/judge-pipeline.yml"
  workflow_dispatch:

jobs:
  judge:
    name: Judge Python code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      # Byte-compile every module so syntax errors fail the pipeline fast,
      # without needing the heavy runtime deps (kokoro, whisper, etc.) installed.
      - name: Compile check
        run: python -m compileall -q pipeline scripts_rerender.py

      # Lint for real errors only (undefined names, bad imports, syntax) —
      # style-only rules are left out so the gate stays meaningful.
      - name: Lint (ruff)
        run: ruff check --select E9,F63,F7,F82 pipeline scripts_rerender.py
